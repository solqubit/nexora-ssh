[package]
name = "nexora-ssh"
version = "0.1.7"
description = "SSH, Telnet and SFTP desktop client"
authors = ["Nexora"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "nexora_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5.3"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
drag = "2.1.1"
fs2 = "0.4"
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
portable-pty = "0.9.0"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.4"
url = "2.5.8"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3.34"
